<title>Paper Music Box</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one full-bleed lamplit desk drawn on canvas; the title and a few paper-tab controls sit quietly along the top edge. Single dark scene by choice. */
:root{
  --desk:#22150e;
  --paper:#efe5cf;
  --paper-hi:#fbf3e1;
  --ink:#2f435b;
  --brass:#c99c47;
  --muted:#cdbd9f;
  --font:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --line:rgba(239,229,207,.28);
  --wash:rgba(201,156,71,.14);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--paper);font-family:var(--font);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 30px;display:flex;flex-wrap:wrap;gap:14px 40px;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(to bottom,rgba(18,11,7,.78),rgba(18,11,7,.45) 60%,rgba(18,11,7,0))}
.hud>*{pointer-events:auto}
.intro{max-width:30rem;min-width:0}
h1{margin:0;font-size:1.65rem;font-weight:700;line-height:1.1;letter-spacing:-.005em}
.intro p{margin:.35rem 0 0;font-size:.98rem;line-height:1.45;color:var(--muted)}
.tools{display:flex;flex-direction:column;gap:12px;align-items:flex-end;min-width:0}
.songs{display:flex;flex-wrap:wrap;gap:4px 22px;justify-content:flex-end}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:2px}
.song{font-size:1rem;font-weight:500;color:var(--muted);padding:4px 0 5px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.song:hover{color:var(--paper)}
.song[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--brass)}
.strip{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;color:var(--paper);font-size:1rem;line-height:1;display:grid;place-items:center;transition:border-color .15s,background .15s}
.step:hover,.ghost:hover{border-color:var(--brass);background:var(--wash)}
.len{min-width:4.2em;text-align:center;color:var(--paper)}
.ghost{border:1px solid var(--line);border-radius:3px;padding:3px 10px;margin-left:10px;color:var(--paper);transition:border-color .15s,background .15s}
@media (max-width:760px){
  .hud{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px;gap:10px}
  .tools{align-items:flex-start}
  .songs{justify-content:flex-start;gap:2px 16px}
  h1{font-size:1.35rem}
  .intro p{font-size:.88rem}
  .song{font-size:.9rem}
}
</style>

<canvas id="scene" aria-label="A paper-strip music box on a wooden desk. Click the paper strip to punch notes; drag the crank to play."></canvas>
<header class="hud" id="hud">
  <div class="intro">
    <h1>Paper Music Box</h1>
    <p>Punch holes in the paper, then turn the crank or hold the brass key to wind it. Click a hole to tape it over; touch the fan to stop.</p>
  </div>
  <div class="tools">
    <div class="songs" role="group" aria-label="Songs">
      <button class="song" id="song-twinkle" data-song="twinkle">Twinkle, Twinkle</button>
      <button class="song" id="song-ode" data-song="ode">Ode to Joy</button>
      <button class="song" id="song-frere" data-song="frere" title="Arranged as a three-voice round">Frère Jacques</button>
      <button class="song" id="song-nearer" data-song="nearer">Nearer, My God, to Thee</button>
      <button class="song" id="song-blank" data-song="blank">Blank strip</button>
    </div>
    <div class="strip">
      <span>Strip length</span>
      <button class="step" id="len-minus" aria-label="Shorten the strip by one bar">−</button>
      <span class="len" id="len" aria-live="polite">12 bars</span>
      <button class="step" id="len-plus" aria-label="Lengthen the strip by one bar">+</button>
      <button class="ghost" id="undo">Undo</button>
    </div>
  </div>
</header>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- constants
const N = 15;
const NAMES = ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
const MIDI  = [60,62,64,65,67,69,71,72,74,76,77,79,81,83,84];
const FREQ  = MIDI.map(m => 440 * Math.pow(2, (m - 69) / 12));
const BPR = 2;              // beats per crank revolution
const TAU = Math.PI * 2;
const FONT = '"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif';
const STORE = 'paper-music-box-v1';

const cvs = document.getElementById('scene');
let ctx = cvs.getContext('2d');
const hud = document.getElementById('hud');
const lenEl = document.getElementById('len');

const mod = (a, n) => ((a % n) + n) % n;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const wrapAng = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

// ---------------------------------------------------------------- songs
// Token: NOTE[:beats], chords joined with '+', 'r' is a rest.
function seq(str, off) {
  const out = []; let b = off || 0;
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === '|') continue;
    const [nm, d] = tok.split(':');
    const dur = d ? parseFloat(d) : 1;
    if (nm !== 'r') for (const n of nm.split('+')) {
      const r = NAMES.indexOf(n);
      if (r < 0) throw new Error('bad note ' + n);
      out.push([b, r]);
    }
    b += dur;
  }
  return out;
}
const TW_BASS = { C: 'C4 G4', F: 'F4 A4', G: 'G4 B4' };
const ODE_BASS = { C: 'C4+E4:2 G4:2', G: 'G4+B4:2 D4:2', Y: 'G4+B4:2 C4+E4:2' };
const ODE_A  = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5:1.5 D5:.5 D5:2';
const ODE_A2 = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5:1.5 C5:.5 C5:2';
const ODE_B  = 'D5 D5 E5 C5 D5 E5:.5 F5:.5 E5 C5 D5 E5:.5 F5:.5 E5 D5 C5 D5 G4:2';
const FJ = 'C5 D5 E5 C5 C5 D5 E5 C5 E5 F5 G5:2 E5 F5 G5:2 G5:.5 A5:.5 G5:.5 F5:.5 E5 C5 G5:.5 A5:.5 G5:.5 F5:.5 E5 C5 C5 G4 C5:2 C5 G4 C5:2';
const FJ_LOW = FJ.replace(/([A-G])5/g, '$14');

// Nearer, My God, to Thee: Lowell Mason's tune Bethany (1856), from the Hymnary.org score, moved from F to C.
// The bass follows the hymn's own bass line, lifted into the box's lower octave.
const HYMN = 'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:2 C5:1 E5:1 D5:4 ' +
  'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:1 C5:1 B4:1 D5:1 C5:4 ' +
  'G5:2 A5:1 G5:1 G5:1.5 E5:.5 G5:2 G5:2 A5:1 G5:1 G5:1.5 E5:.5 D5:2 ' +
  'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:1 C5:1 B4:1 D5:1 C5:4';
const HYMN_BASS = 'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 C4:2 E4:1 C4:1 G4:4 ' +
  'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 G4:4 C4:4 ' +
  'C4:2 C4:1 C4:1 C4:4 C4:2 F4:1 C4:1 B4:1.5 C4:.5 G4:2 ' +
  'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 G4:4 C4:4';
const SONGS = {
  twinkle: { L: 48, tempo: 1.9, notes: () => [
    ...seq('C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2 G5 G5 F5 F5 E5 E5 D5:2 G5 G5 F5 F5 E5 E5 D5:2 C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2'),
    ...seq('CCFCFCGCCFCGCFCGCCFCFCGC'.split('').map(c => TW_BASS[c]).join(' ')) ] },
  ode: { L: 64, tempo: 2.1, notes: () => [
    ...seq([ODE_A, ODE_A2, ODE_B, ODE_A2].join(' ')),
    ...seq('CGCGCGCYGGGCCGCY'.split('').map(c => ODE_BASS[c]).join(' ')) ] },
  frere: { L: 32, tempo: 2.0, notes: () => [ ...seq(FJ, 0), ...seq(FJ_LOW, 8), ...seq(FJ, 16) ] },
  nearer: { L: 64, tempo: 1.6, notes: () => [...seq(HYMN), ...seq(HYMN_BASS)] },
  blank: { L: 32, tempo: 2.0, notes: () => [] }
};

// ---------------------------------------------------------------- state
let L = 48;
let notes = new Set();        // key = halfBeat * 16 + row
let tapes = new Map();        // key -> {a, w}
const holeBorn = new Map();   // key -> time punched (for the pop animation)
let pT = -1.25;               // unwrapped strip position under the comb, in beats
let songId = 'twinkle';
let baseTempo = 1.9;          // beats per second when the spring is strong
let energy = 0, motorV = 0, braked = false, winding = false, keyAng = 0, fanAng = 0, windAcc = 0;
let fling = 0, movedBeats = 0, tickAcc = 0;
const tine = new Float32Array(N);
let chads = [], ripples = [];
let hover = null, drag = null;
let usedKey = false, usedCrank = false, usedFan = false, everPlayed = false;
let undoStack = [];
let now = 0;

function loadSong(id, keepPos) {
  const s = SONGS[id];
  songId = id; L = s.L; baseTempo = s.tempo;
  sceneRestart = true;   // loading any song, even the current one, restarts its scene and reveal
  notes = new Set(); tapes = new Map(); holeBorn.clear();
  for (const [b, r] of s.notes()) notes.add(mod(Math.round(b * 2), 2 * L) * 16 + r);
  if (!keepPos) pT = Math.round(pT / L) * L - 1.25;
  refreshUi(); save();
}
function snapshot() { return { L, notes: new Set(notes), tapes: new Map(tapes), songId, baseTempo }; }
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 200) undoStack.shift(); }
function undo() {
  const s = undoStack.pop(); if (!s) return;
  L = s.L; notes = s.notes; tapes = s.tapes; songId = s.songId; baseTempo = s.baseTempo;
  refreshUi(); save(); tickSound(.12);
}
function setLength(newL) {
  newL = clamp(newL, 8, 128); if (newL === L) return;
  pushUndo();
  const lim = newL * 2;
  for (const k of [...notes]) if ((k >> 4) >= lim) notes.delete(k);
  for (const k of [...tapes.keys()]) if ((k >> 4) >= lim) tapes.delete(k);
  L = newL; refreshUi(); save();
}
function refreshUi() {
  lenEl.textContent = (L / 4) + (L === 4 ? ' bar' : ' bars');
  document.querySelectorAll('[data-song]').forEach(b => b.setAttribute('aria-pressed', b.dataset.song === songId ? 'true' : 'false'));
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE, JSON.stringify({ L, songId, baseTempo, n: [...notes],
        tp: [...tapes].map(([k, v]) => [k, +v.a.toFixed(2), +v.w.toFixed(2)]) }));
    } catch (e) { /* storage unavailable: the strip just won't persist */ }
  }, 250);
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d || !Array.isArray(d.n) || !(d.L >= 8 && d.L <= 128)) return false;
    L = d.L; songId = d.songId || 'blank'; baseTempo = d.baseTempo || 2;
    notes = new Set(d.n.filter(k => Number.isInteger(k) && (k >> 4) < 2 * L && (k & 15) < N));
    tapes = new Map((d.tp || []).map(([k, a, w]) => [k, { a, w }]));
    refreshUi();
    return true;
  } catch (e) { return false; }
}

// ---------------------------------------------------------------- layout
let W = 0, H = 0, dpr = 1, G = {};
let deskCv = null, paperPat = null;

function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  const hb = Math.max(...[...hud.children].map(c => c.getBoundingClientRect().bottom));   // content bottom, not the fade below it
  const ir = hud.children[0].getBoundingClientRect(), tr = hud.children[1].getBoundingClientRect();
  const gapX = tr.top < ir.bottom && tr.left > ir.right ? (ir.right + tr.left) / 2 : null;   // open sky between the title and the song list, if there is any
  let rh = Math.min(26, H * 0.034, W * 0.058);
  for (; rh > 10; rh -= 0.5) {
    if (3.7 * rh + (N + 1) * rh + 5.1 * rh + 44 <= H - hb - 6) break;
  }
  const stripH = (N + 1) * rh;
  const top = hb + 6 + 3.7 * rh, bot = H - 44 - 5.1 * rh;
  const y0 = top + Math.max(0, (bot - top - stripH) * 0.45);
  const pick = Math.max(W * 0.27, rh * 6.6);
  G = {
    rh, hb, gapX, col: rh * 1.25, y0, y1: y0 + stripH, pick,
    plateL: pick - 5.7 * rh, plateR: pick + 3.0 * rh, plateT: y0 - 3.4 * rh, plateB: y0 + stripH + 1.8 * rh,
    roller: pick + 2.0 * rh,
    barrel: { x: pick - 2.65 * rh, y: y0 - 1.85 * rh, r: 1.25 * rh },
    fan: { x: pick + 1.25 * rh, y: y0 - 1.8 * rh, r: 1.0 * rh },
    hub: { x: pick - 3.3 * rh, y: y0 + stripH + 2.75 * rh }, arm: 1.75 * rh,
    mm: { x: 16, y: H - 30, w: W - 32, h: 16 }
  };
  buildDesk(); buildPaper(); buildScene();
}
const rowY = r => G.y0 + G.rh * (N - r);
const stripX = t => G.pick + (t / 2 - mod(pT, L)) * G.col; // t = unwrapped half-beat index relative to wrapped position

function buildDesk() {
  const c = document.createElement('canvas');
  const s = Math.min(dpr, 1.5);
  c.width = Math.ceil(W * s); c.height = Math.ceil(H * s);
  const g = c.getContext('2d'); g.scale(s, s);
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#301d12'); bg.addColorStop(1, '#1b100a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const plankH = Math.max(130, H / 4.3);
  for (let py = -rnd(0, plankH); py < H; py += plankH) {
    const tone = rnd(-14, 14);
    g.fillStyle = `rgba(${78 + tone | 0},${46 + tone * .6 | 0},26,0.33)`;
    g.fillRect(0, py, W, plankH);
    for (let i = 0; i < plankH / 2; i++) {
      const y = py + rnd(0, plankH), A = rnd(1, 7), f = rnd(.0015, .007), ph = rnd(0, 6), f2 = rnd(.01, .03), A2 = rnd(.2, 1.4);
      g.beginPath();
      for (let x = -10; x <= W + 10; x += 10) {
        const yy = y + A * Math.sin(x * f + ph) + A2 * Math.sin(x * f2 + ph * 2);
        if (x < 0) g.moveTo(x, yy); else g.lineTo(x, yy);
      }
      const dark = Math.random() < .62;
      g.strokeStyle = dark ? `rgba(14,6,2,${rnd(.08, .3)})` : `rgba(160,102,58,${rnd(.04, .12)})`;
      g.lineWidth = rnd(.5, 2.2); g.stroke();
    }
    g.fillStyle = 'rgba(6,3,1,.8)'; g.fillRect(0, py - 1, W, 2);
    g.fillStyle = 'rgba(170,115,70,.12)'; g.fillRect(0, py + 1, W, 1);
  }
  const lx = W * .45, ly = H * .4, R = Math.max(W, H) * .78;
  const lg = g.createRadialGradient(lx, ly, 0, lx, ly, R);
  lg.addColorStop(0, 'rgba(255,186,105,.2)');
  lg.addColorStop(.45, 'rgba(255,150,70,.05)');
  lg.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  deskCv = c;
}
function buildPaper() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#efe5cf'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 900; i++) {
    const x = rnd(0, s), y = rnd(0, s), l = rnd(2, 9), a = rnd(0, Math.PI);
    g.strokeStyle = Math.random() < .5 ? 'rgba(120,95,60,.06)' : 'rgba(255,255,255,.2)';
    g.lineWidth = rnd(.3, 1);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 320; i++) { g.fillStyle = `rgba(110,85,50,${rnd(.03, .1)})`; g.fillRect(rnd(0, s), rnd(0, s), 1, 1); }
  paperPat = ctx.createPattern(c, 'repeat');
}

// ---------------------------------------------------------------- audio
let ac = null, master = null, verbIn = null, noiseBuf = null, whirG = null, whirF = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { ac = new AC(); } catch (e) { ac = null; return; }
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .004; comp.release.value = .2;
  comp.connect(ac.destination);
  master = ac.createGain(); master.gain.value = .75; master.connect(comp);
  // a small wooden room: short, dense, slightly dark tail
  const conv = ac.createConvolver();
  const n = Math.floor(ac.sampleRate * 1.7), ib = ac.createBuffer(2, n, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ib.getChannelData(ch); let lp = 0;
    for (let i = 0; i < n; i++) { lp += ((Math.random() * 2 - 1) - lp) * .45; d[i] = lp * Math.pow(1 - i / n, 2.6); }
  }
  conv.buffer = ib;
  verbIn = ac.createGain(); verbIn.gain.value = .3; verbIn.connect(conv); conv.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ws = ac.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
  whirF = ac.createBiquadFilter(); whirF.type = 'bandpass'; whirF.frequency.value = 400; whirF.Q.value = 1.4;
  whirG = ac.createGain(); whirG.gain.value = 0;
  ws.connect(whirF); whirF.connect(whirG); whirG.connect(master); ws.start();
}
function noiseHit(t, type, freq, q, vol, len) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + len);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * .8, len + .02);
  return g;
}
function pluck(r, delay, vel, tIdx) {
  delay = delay || 0; vel = vel == null ? 1 : vel;
  const fire = () => { tine[r] = 1; ripples.push({ x: G.pick, y: rowY(r), t: 0 }); ambNote(r, tIdx); };
  if (delay > .004) setTimeout(fire, delay * 1000); else fire();
  if (!ac) return;
  const t = ac.currentTime + .012 + delay, f = FREQ[r];
  const dec = 2.1 * Math.pow(261.6 / f, .55);
  const out = ac.createGain(); out.gain.value = .3 * vel * (1 - r * .012);
  let tail = out;
  if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = (r / (N - 1) - .5) * .55; out.connect(p); tail = p; }
  tail.connect(master); tail.connect(verbIn);
  const parts = [[1, 1, dec / 3.2], [1.0017, .32, dec / 3], [2, .14, dec / 7], [5.95, .11, .06], [9.7, .05, .025]];
  for (const [m, a, tau] of parts) {
    const fr = f * m; if (fr > 17000) continue;
    const o = ac.createOscillator(); o.frequency.value = fr;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + .0025); g.gain.setTargetAtTime(0, t + .0025, tau);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + tau * 7 + .05);
  }
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
  const ng = ac.createGain(); ng.gain.setValueAtTime(.16, t); ng.gain.exponentialRampToValueAtTime(.0008, t + .012);
  s.connect(hp); hp.connect(ng); ng.connect(out); s.start(t, Math.random() * .8, .03);
}
function punchSound() {
  if (!ac) return; const t = ac.currentTime + .004;
  noiseHit(t, 'lowpass', 2400, .8, .5, .05);
  noiseHit(t, 'highpass', 5200, .7, .22, .01);
  const o = ac.createOscillator(); o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(55, t + .06);
  const g = ac.createGain(); g.gain.setValueAtTime(.45, t); g.gain.exponentialRampToValueAtTime(.0008, t + .08);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .1);
}
function tapeSound() {

function updateAmb(dt) {

function ambNote(r, t) {

      if (best) best.lit = true;

function drawSparks(k, mirrorAt) {

    ctx.fillRect(x, top + off, 4, base - top);
  }
  ctx.restore();
  const wg = ctx.createLinearGradient(0, hz, 0, H);
  wg.addColorStop(0, '#0d2b30'); wg.addColorStop(1, '#02060b');
  ctx.globalAlpha = stage(.2, .55);
  ctx.fillStyle = wg; ctx.fillRect(0, hz, W, H - hz);
  const rg = ctx.createLinearGradient(0, hz, 0, hz + (H - hz) * .6);
  rg.addColorStop(0, 'rgba(70,255,170,.12)'); rg.addColorStop(1, 'rgba(70,255,170,0)');
  ctx.globalAlpha = auA; ctx.fillStyle = rg; ctx.fillRect(0, hz, W, (H - hz) * .6);
  ctx.globalAlpha = stage(.2, .55); ctx.drawImage(LY.trees, 0, hz - LY.trees.height + 1);
  ctx.globalAlpha = 1;
}

// render one scene at a given reveal into the offscreen layer, then lay it over the desk at the given strength
function renderScene(sc, reveal, alpha) {
  if (alpha < .004 || !LY.cv) return;
  const main = ctx, keepRv = rv, keepDawn = dawn;
  rv = reveal; dawn = reveal;
  ctx = LY.c2;
  ctx.setTransform(LY.sd, 0, 0, LY.sd, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  try {
    if (sc === 'night') drawNight(); else if (sc === 'fireworks') drawFireworks(); else if (sc === 'bells') drawBells(); else if (sc === 'lanterns') drawLanterns(); else drawAurora();
  } finally { ctx = main; rv = keepRv; dawn = keepDawn; }
  ctx.save(); ctx.globalAlpha = Math.min(1, alpha); ctx.drawImage(LY.cv, 0, 0, W, H); ctx.restore();
}
function drawAmb() {
  if (ghost) renderScene(ghost.scene, ghost.rv, ghostAlpha());   // the last song's scene, receding layer by layer
  renderScene(sceneOf(), rv, amb);
}

function draw() {
  if (!W || !H || !deskCv || !deskCv.width || !deskCv.height) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(deskCv, 0, 0, W, H);
  drawAmb();
  const air = [], paperChads = [];
  const chadA = 1 - .97 * Math.max(amb, ghostAlpha());   // the punched-out bits fade away with the rest of the desk as a scene comes up
  for (const c of chads) {
    if (!c.ground) air.push(c);
    else if (onPaper(c)) paperChads.push(c);
    else if (c.x > G.plateL && c.x < G.plateR && c.y > G.plateT && c.y < G.plateB) paperChads.push(c);
    else { ctx.globalAlpha = chadA; drawChad(c); ctx.globalAlpha = 1; }
  }
  drawPlate();
  drawStrip();
  ctx.globalAlpha = chadA; for (const c of paperChads) drawChad(c); ctx.globalAlpha = 1;
  drawDrive();
  drawRoller();
  drawComb();
  drawBarrel();
  drawFan();
  drawCrank();
  drawHover();
  ctx.globalAlpha = chadA; for (const c of air) drawChad(c); ctx.globalAlpha = 1;
  // lamp falloff over everything on the desk
  const vg = ctx.createRadialGradient(W * .45, H * .42, Math.min(W, H) * .3, W * .45, H * .42, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // first-use hints and the strip map: these step back as the scene comes up
  ctx.save(); ctx.globalAlpha = 1 - .9 * uiQuiet;
  const k = crankPos();
  if (!usedCrank) { ring(k.x, k.y, G.rh * .8, 0); hint('Grab the crank, then circle', G.hub.x + G.arm + G.rh * 1.1, G.hub.y + G.rh * .2, 'left', 0); }
  drawCrankGesture();
  if (!usedKey) {
    ring(G.barrel.x, G.barrel.y, G.barrel.r * 1.12, 1.5);
    ctx.font = `700 ${Math.max(12, G.rh * .58)}px ${FONT}`;
    const hx = G.barrel.x - G.barrel.r - G.rh * .45;
    if (hx - ctx.measureText('Hold to wind').width > 6) hint('Hold to wind', hx, G.barrel.y, 'right', 1.5);
    else if (G.plateT - G.rh * 1.0 > G.hb) hint('Hold to wind', G.barrel.x, G.plateT - G.rh * .6, 'center', 1.5);
  }
  if (!usedFan && motorV > .5) hint('Touch the fan to stop', G.fan.x + G.fan.r + G.rh * .5, G.fan.y, 'left', 3);
  drawMini();
  ctx.restore();
}

// ---------------------------------------------------------------- input
function inMini(x, y) { const m = G.mm; return x >= m.x - 4 && x <= m.x + m.w + 4 && y >= m.y - 8 && y <= m.y + m.h + 8; }
function miniJump(x) { const m = G.mm; const f = clamp((x - m.x) / m.w, 0, 1); pT = Math.floor(pT / L) * L + f * L; }

function zoneAt(x, y) {
  const k = crankPos();
  if (dist(x, y, k.x, k.y) < G.rh * 1.4 || dist(x, y, G.hub.x, G.hub.y) < G.rh * 1.2) return 'crank';
  if (dist(x, y, G.barrel.x, G.barrel.y) < G.barrel.r * 1.05) return 'key';
  if (dist(x, y, G.fan.x, G.fan.y) < G.fan.r * 1.15) return 'fan';
  if (inMini(x, y)) return 'mini';
  if (y > G.y0 && y < G.y1 && !(x > G.plateL && x < G.plateR)) return 'paper';
  return 'desk';
}

cvs.addEventListener('pointerdown', e => {
  ensureAudio();
  const x = e.clientX, y = e.clientY, z = zoneAt(x, y);
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  const t = performance.now();
  if (z === 'crank') { drag = { mode: 'crank', lx: x, ly: y, dir: null, trail: [{ x, y, t: now }], t0: now }; usedCrank = true; fling = 0; }
  else if (z === 'key') { drag = { mode: 'wind' }; winding = true; braked = false; usedKey = true; }
  else if (z === 'fan') { drag = { mode: 'none' }; braked = !braked; usedFan = true; tickSound(.2); }
  else if (z === 'mini') { drag = { mode: 'mini' }; miniJump(x); fling = 0; }
  else if (z === 'paper') { drag = { mode: 'paper', x0: x, y0: y, lx: x, lt: t, moved: false, vel: 0 }; fling = 0; }
  else drag = { mode: 'sweep', lx: x, ly: y, lt: t };
  hover = null;
  if (z === 'crank') cvs.style.cursor = 'grabbing';
  e.preventDefault();
});
cvs.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY, t = performance.now();
  if (!drag) {
    const z = zoneAt(x, y);
    hover = z === 'paper' ? hitPaper(x, y) : null;
    cvs.style.cursor = z === 'crank' ? 'grab' : (z === 'key' || z === 'fan' || z === 'mini') ? 'pointer' : z === 'paper' ? 'crosshair' : 'default';
    return;
  }
  if (drag.mode === 'crank') {
    // Once the crank is held, any circling motion turns it: the handle follows how much the hand's path turns,
    // so one loop of any size, anywhere on screen, is one turn of the crank. Clockwise plays forward.
    const dx = x - drag.lx, dy = y - drag.ly;
    if (Math.hypot(dx, dy) >= 4) {
      const a = Math.atan2(dy, dx);
      if (drag.dir != null) {
        const d = wrapAng(a - drag.dir);
        if (Math.abs(d) < 1.3) advance(d / TAU * BPR, 0, 'crank');
      }
      drag.dir = a; drag.lx = x; drag.ly = y;
    }
    drag.trail.push({ x, y, t: now });
    cvs.style.cursor = 'grabbing';
  } else if (drag.mode === 'paper') {
    if (!drag.moved && Math.abs(x - drag.x0) + Math.abs(y - drag.y0) > 6) { drag.moved = true; cvs.style.cursor = 'grabbing'; }
    if (drag.moved) {
      const dx = x - drag.lx, db = -dx / G.col, ds = Math.max(.001, (t - drag.lt) / 1000);
      advance(db, 0, 'paper');
      drag.vel = drag.vel * .5 + (db / ds) * .5;
      drag.lx = x; drag.lt = t;
    }
  } else if (drag.mode === 'mini') miniJump(x);
  else if (drag.mode === 'sweep') {
    const ds = Math.max(.001, (t - drag.lt) / 1000), vx = (x - drag.lx) / ds, vy = (y - drag.ly) / ds, R = G.rh * 1.5;
    for (const c of chads) {
      if (!c.ground) continue;
      if (dist(c.x, c.y, x, y) < R) { c.vx += (vx * .9 - c.vx) * .5; c.vy += (vy * .9 - c.vy) * .5; c.vr += rnd(-4, 4); }
    }
    drag.lx = x; drag.ly = y; drag.lt = t;
  }
});
function endDrag(e) {
  if (!drag) return;
  if (drag.mode === 'paper') {
    if (!drag.moved) clickPaper(drag.x0, drag.y0);
    else if (performance.now() - drag.lt < 90) fling = clamp(drag.vel, -14, 14);
  } else if (drag.mode === 'wind') winding = false;
  drag = null;
  if (e && e.type !== 'pointercancel') {
    const z = zoneAt(e.clientX, e.clientY);
    hover = z === 'paper' ? hitPaper(e.clientX, e.clientY) : null;
  }
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cvs.addEventListener('wheel', e => {
  e.preventDefault(); ensureAudio();
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / G.col * .5;
  advance(clamp(d, -4, 4), 0, 'paper');
}, { passive: false });

function clickPaper(x, y) {
  const h = hitPaper(x, y); if (!h) return;
  const k = h.t * 16 + h.r;
  pushUndo();
  if (notes.has(k)) {
    notes.delete(k);
    tapes.set(k, { a: rnd(-.3, .3), w: rnd(.95, 1.2) });
    tapeSound();
  } else {
    notes.add(k); holeBorn.set(k, now);
    punchSound(); spawnChad(h.x, h.y);

  }
  save();
}

window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (tag === 'BUTTON' || tag === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); ensureAudio(); braked = !braked; usedFan = true; }
  else if (e.key.toLowerCase() === 'w' && !e.repeat) { ensureAudio(); winding = true; braked = false; usedKey = true; }
  else if (e.key === 'ArrowRight') { ensureAudio(); advance(.5, 0, 'crank'); }
  else if (e.key === 'ArrowLeft') { advance(-.5, 0, 'crank'); }
});
window.addEventListener('keyup', e => { if (e.key.toLowerCase() === 'w') winding = false; });

document.querySelectorAll('[data-song]').forEach(b => b.addEventListener('click', () => {
  ensureAudio(); pushUndo(); loadSong(b.dataset.song); tickSound(.12);
}));
document.getElementById('len-minus').addEventListener('click', () => setLength(L - 4));
document.getElementById('len-plus').addEventListener('click', () => setLength(L + 4));
document.getElementById('undo').addEventListener('click', undo);

let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

// ---------------------------------------------------------------- boot
if (!restore()) loadSong('twinkle'); else refreshUi();
layout();
let last = performance.now();
function frame(ms) {
  const dt = Math.min(.05, Math.max(0, (ms - last) / 1000)); last = ms; now = ms / 1000;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// test hook: step the simulation by hand when the page is not being animated
window.__pmb = {
  get state() { return { pT: +pT.toFixed(3), L, notes: notes.size, tapes: tapes.size, energy: +energy.toFixed(3), motorV: +motorV.toFixed(3), braked, chads: chads.length, lit: [...tine].filter(v => v > .05).length, amb: +amb.toFixed(2), rv: +rv.toFixed(2), warm: +warm.toFixed(1), spd: +spd.toFixed(2), sparks: sparks.length, rockets: rockets.length, scene: sceneOf(), gt: gesture.trail.length, ga: +gesture.a.toFixed(2), ui: +uiQuiet.toFixed(2), hud: hud.style.opacity, ghost: ghost ? ghost.scene + ":" + ghostAlpha().toFixed(2) : "" }; },
  step(n, dt) { dt = dt || 1 / 60; for (let i = 0; i < n; i++) { now += dt; update(dt); } draw(); }
};
})();
</script>
