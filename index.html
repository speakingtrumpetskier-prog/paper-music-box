<title>Paper Music Box</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one full-bleed lamplit desk drawn on canvas; the title and a few paper-tab controls sit quietly along the top edge. Single dark scene by choice. */
:root{
  --desk:#22150e;
  --paper:#efe5cf;
  --paper-hi:#fbf3e1;
  --ink:#2f435b;
  --brass:#c99c47;
  --muted:#cdbd9f;
  --font:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --line:rgba(239,229,207,.28);
  --wash:rgba(201,156,71,.14);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--paper);font-family:var(--font);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 30px;display:flex;flex-wrap:wrap;gap:14px 40px;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(to bottom,rgba(18,11,7,.78),rgba(18,11,7,.45) 60%,rgba(18,11,7,0))}
.hud>*{pointer-events:auto}
.intro{max-width:30rem;min-width:0}
h1{margin:0;font-size:1.65rem;font-weight:700;line-height:1.1;letter-spacing:-.005em}
.intro p{margin:.35rem 0 0;font-size:.98rem;line-height:1.45;color:var(--muted)}
.tools{display:flex;flex-direction:column;gap:12px;align-items:flex-end;min-width:0}
.songs{display:flex;flex-wrap:wrap;gap:4px 22px;justify-content:flex-end}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:2px}
.song{font-size:1rem;font-weight:500;color:var(--muted);padding:4px 0 5px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.song:hover{color:var(--paper)}
.song[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--brass)}
.strip{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;color:var(--paper);font-size:1rem;line-height:1;display:grid;place-items:center;transition:border-color .15s,background .15s}
.step:hover,.ghost:hover{border-color:var(--brass);background:var(--wash)}
.len{min-width:4.2em;text-align:center;color:var(--paper)}
.ghost{border:1px solid var(--line);border-radius:3px;padding:3px 10px;margin-left:10px;color:var(--paper);transition:border-color .15s,background .15s}
.ghost[aria-pressed="true"]{border-color:var(--brass);background:var(--wash)}
[hidden]{display:none!important}
.mech{position:fixed;z-index:2;border-radius:3px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.45)}
.mech canvas{width:100%;height:100%;display:block}
@media (max-width:760px){
  .hud{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px;gap:10px}
  .tools{align-items:flex-start}
  .songs{justify-content:flex-start;gap:2px 16px}
  h1{font-size:1.35rem}
  .intro p{font-size:.88rem}
  .song{font-size:.9rem}
}
</style>

<canvas id="scene" aria-label="A paper-strip music box on a wooden desk. Click the paper strip to punch notes; drag the crank to play."></canvas>
<header class="hud" id="hud">
  <div class="intro">
    <h1>Paper Music Box</h1>
    <p>Punch holes in the paper, then turn the crank or hold the brass key to wind it. Click a hole to tape it over; touch the fan to stop.</p>
  </div>
  <div class="tools">
    <div class="songs" role="group" aria-label="Songs">
      <button class="song" id="song-nearer" data-song="nearer">Nearer, My God, to Thee</button>
      <button class="song" id="song-sailor" data-song="sailor">Drunken Sailor</button>
      <button class="song" id="song-canon" data-song="canon">Canon in D</button>
      <button class="song" id="song-twinkle" data-song="twinkle">Twinkle, Twinkle</button>
      <button class="song" id="song-ode" data-song="ode">Ode to Joy</button>
      <button class="song" id="song-frere" data-song="frere" title="Arranged as a three-voice round">Frère Jacques</button>
      <button class="song" id="song-gymno" data-song="gymno">Gymnopédie</button>
      <button class="song" id="song-dies" data-song="dies">Dies Irae</button>
      <button class="song" id="song-blank" data-song="blank">Blank strip</button>
    </div>
    <div class="strip">
      <span>Strip length</span>
      <button class="step" id="len-minus" aria-label="Shorten the strip by one bar">−</button>
      <span class="len" id="len" aria-live="polite">12 bars</span>
      <button class="step" id="len-plus" aria-label="Lengthen the strip by one bar">+</button>
      <button class="ghost" id="undo">Undo</button>
      <button class="ghost" id="mech-toggle" aria-pressed="false">How it plays</button>
    </div>
  </div>
</header>
<aside class="mech" id="mech" hidden aria-label="A live cutaway of the music box mechanism"><canvas id="mechCv"></canvas></aside>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- constants
const N = 15;
const NAMES = ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
const MIDI  = [60,62,64,65,67,69,71,72,74,76,77,79,81,83,84];
const FREQ  = MIDI.map(m => 440 * Math.pow(2, (m - 69) / 12));
const BPR = 2;              // beats per crank revolution
const TAU = Math.PI * 2;
const FONT = '"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif';
const STORE = 'paper-music-box-v1';

const cvs = document.getElementById('scene');
let ctx = cvs.getContext('2d');
const hud = document.getElementById('hud');
const lenEl = document.getElementById('len');

const mod = (a, n) => ((a % n) + n) % n;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const wrapAng = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

// ---------------------------------------------------------------- songs
// Token: NOTE[:beats], chords joined with '+', 'r' is a rest.
function seq(str, off) {
  const out = []; let b = off || 0;
  for (const tok of str.trim().split(/\s+/)) {
    if (tok === '|') continue;
    const [nm, d] = tok.split(':');
    const dur = d ? parseFloat(d) : 1;
    if (nm !== 'r') for (const n of nm.split('+')) {
      const r = NAMES.indexOf(n);
      if (r < 0) throw new Error('bad note ' + n);
      out.push([b, r]);
    }
    b += dur;
  }
  return out;
}
const TW_BASS = { C: 'C4 G4', F: 'F4 A4', G: 'G4 B4' };
const ODE_BASS = { C: 'C4+E4:2 G4:2', G: 'G4+B4:2 D4:2', Y: 'G4+B4:2 C4+E4:2' };
const ODE_A  = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5:1.5 D5:.5 D5:2';
const ODE_A2 = 'E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5:1.5 C5:.5 C5:2';
const ODE_B  = 'D5 D5 E5 C5 D5 E5:.5 F5:.5 E5 C5 D5 E5:.5 F5:.5 E5 D5 C5 D5 G4:2';
const FJ = 'C5 D5 E5 C5 C5 D5 E5 C5 E5 F5 G5:2 E5 F5 G5:2 G5:.5 A5:.5 G5:.5 F5:.5 E5 C5 G5:.5 A5:.5 G5:.5 F5:.5 E5 C5 C5 G4 C5:2 C5 G4 C5:2';
const FJ_LOW = FJ.replace(/([A-G])5/g, '$14');

// Nearer, My God, to Thee: Lowell Mason's tune Bethany (1856), from the Hymnary.org score, moved from F to C.
// The bass follows the hymn's own bass line, lifted into the box's lower octave.
const HYMN = 'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:2 C5:1 E5:1 D5:4 ' +
  'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:1 C5:1 B4:1 D5:1 C5:4 ' +
  'G5:2 A5:1 G5:1 G5:1.5 E5:.5 G5:2 G5:2 A5:1 G5:1 G5:1.5 E5:.5 D5:2 ' +
  'E5:2 D5:1 C5:1 C5:1.5 A4:.5 A4:2 G4:1 C5:1 B4:1 D5:1 C5:4';
const HYMN_BASS = 'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 C4:2 E4:1 C4:1 G4:4 ' +
  'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 G4:4 C4:4 ' +
  'C4:2 C4:1 C4:1 C4:4 C4:2 F4:1 C4:1 B4:1.5 C4:.5 G4:2 ' +
  'C4:2 G4:1 A4:1 F4:1.5 F4:.5 F4:2 G4:4 C4:4';
const seqLen = str => str.trim().split(/\s+/).reduce((a, t) => a + (t.includes(':') ? parseFloat(t.split(':')[1]) : 1), 0);
const tagged = (arr, v) => arr.map(([b, r]) => [b, r, v]);   // voices: 0 bass or drone, 1 melody, 2+ other parts

// Satie, Gymnopédie No. 1 (1888): the first section, from the Mutopia edition (a Dover reprint). Written here in C
// and played on a comb tuned a whole step up, so it sounds in Satie's D.
// Three beats to a bar: the bass on the first beat, the chord on the second, the melody above. The middle section
// needs a note this comb does not have in the same key, so the strip loops the first section.
const GYM_MEL = 'r:12 r E5 G5 F5 E5 B4 A4 B4 C5 G4:3 E4:12 r E5 G5 F5 E5 B4 A4 B4 C5 G4:3 B4:3 E5:3 D4:9';
function gymnopedie() {
  const out = tagged(seq(GYM_MEL), 1), bars = [];
  for (let i = 0; i < 16; i++) bars.push(i % 2 ? ['C4', 'E4 G4 B4'] : ['F4', 'C4 E4 A4']);
  bars.push(['E4', 'G4 B4 E5'], ['A4', 'C5 E5'], ['D4', 'F4 A4'], ['D4', 'F4 A4 C5'], ['C4', 'G4']);
  bars.forEach(([bass, chord], i) => {
    out.push([i * 3, NAMES.indexOf(bass), 0]);
    for (const n of chord.split(' ')) out.push([i * 3 + 1, NAMES.indexOf(n), 2]);
  });
  return out;
}

// Dies irae (13th-century sequence), the first verse, from the chant score on Wikipedia. It is in D Dorian, which
// lies on the white keys. Sung twice: plain over a low drone, then with a second voice a fourth below, as in early organum.
const DIES = ['F5 E5 F5 D5 E5 C5 D5 D5:2 r', 'F5 F5 G5 F5 E5 D5 C5 E5 F5 E5 D5:2 r', 'A4 C5 D5 D5 D5 C5 E5 F5 E5 D5:2 r'];
function diesIrae() {
  const out = [], D4 = NAMES.indexOf('D4'); let b = 0;
  for (let pass = 0; pass < 2; pass++) for (const line of DIES) {
    const ns = seq(line, b);
    out.push([b, D4, 0], [ns[ns.length - 1][0], D4, 0]);
    for (const [nb, r] of ns) { out.push([nb, r, 1]); if (pass) out.push([nb, r - 3, 2]); }
    b += seqLen(line);
  }
  return out;
}

// What Shall We Do with the Drunken Sailor (a capstan shanty sung by the 1830s), D Dorian, from the score on German
// Wikibooks. A beat here is an eighth note. A low note on the strong beats and a chord on the off-beats, like a squeezebox.
const SAILOR = 'A4 A4:.5 A4:.5 A4 A4:.5 A4:.5 A4 D4 F4 A4 G4 G4:.5 G4:.5 G4 G4:.5 G4:.5 G4 C4 E4 G4 ' +
  'A4 A4:.5 A4:.5 A4 A4:.5 A4:.5 A4 B4 C5 D5 C5 A4 G4 E4 D4:2 D4:2 ' +
  'A4:2 A4:1.5 A4:.5 A4 D4 F4 A4 G4:2 G4:1.5 G4:.5 G4 C4 E4 G4 ' +
  'A4:2 A4:1.5 A4:.5 A4 B4 C5 D5 C5 A4 G4 E4 D4:2 D4:2';
function sailor() {
  const out = tagged(seq(SAILOR), 1), CH = { D: ['D4', 'D5 F5 A5'], C: ['C4', 'C5 E5 G5'] };
  const half = (b, ch) => { out.push([b, NAMES.indexOf(CH[ch][0]), 0]); for (const n of CH[ch][1].split(' ')) out.push([b + 2, NAMES.indexOf(n), 2]); };
  'DCDXDCDX'.split('').forEach((h, bar) => {           // X: C for the first half of the bar, D minor for the second
    const b0 = bar * 8;
    if (h === 'X') { half(b0, 'C'); half(b0 + 4, 'D'); } else { half(b0, h); half(b0 + 4, h); }
  });
  return out;
}

// Pachelbel, Canon in D (c. 1694), from the Mutopia edition of the original parts for three violins and bass.
// Written here in C and played on a comb tuned a whole step up, so it sounds in D. A beat is an eighth note.
// A music-box arrangement of the famous opening: the bass plays its two-bar ground alone, the first violin plays
// the first eight bars of its line, then plays them again while a second violin follows two bars behind, in canon.
// (In bar 6 the low neighbour note sits below the comb, so it becomes the third above.)
const CANON = 'E5:2 D5:2 C5:2 B4:2 A4:2 G4:2 A4:2 B4:2 C5:2 B4:2 A4:2 G4:2 F4:2 E4:2 F4:2 D4:2 ' +
  'C4 E4 G4 F4 E4 C4 E4 D4 C4 E4 C4 G4 F4 A4 G4 F4 ' +
  'E4 C4 D4 B4 C5 E5 G5 G4 A4 F4 G4 E4 C4 C5 C5:1.5 B4:.5';
const GROUND = 'C4:2 G4:2 A4:2 E4:2 F4:2 C4:2 F4:2 G4:2';
function canon() {
  const out = [];
  for (let k = 0; k < 10; k++) out.push(...tagged(seq(GROUND, k * 16), 0));
  out.push(...tagged(seq(CANON, 16), 1), ...tagged(seq(CANON, 80), 1), ...tagged(seq(CANON, 96), 2));
  for (const n of ['C4', 'G4']) out.push([160, NAMES.indexOf(n), 0]);
  for (const n of ['C5', 'E5']) out.push([160, NAMES.indexOf(n), 1]);   // the closing chord
  return out;
}
const SONGS = {
  twinkle: { L: 48, tempo: 1.9, notes: () => [
    ...seq('C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2 G5 G5 F5 F5 E5 E5 D5:2 G5 G5 F5 F5 E5 E5 D5:2 C5 C5 G5 G5 A5 A5 G5:2 F5 F5 E5 E5 D5 D5 C5:2'),
    ...seq('CCFCFCGCCFCGCFCGCCFCFCGC'.split('').map(c => TW_BASS[c]).join(' ')) ] },
  ode: { L: 64, tempo: 2.1, notes: () => [
    ...seq([ODE_A, ODE_A2, ODE_B, ODE_A2].join(' ')),
    ...seq('CGCGCGCYGGGCCGCY'.split('').map(c => ODE_BASS[c]).join(' ')) ] },
  frere: { L: 32, tempo: 2.0, notes: () => [ ...seq(FJ, 0), ...seq(FJ_LOW, 8), ...seq(FJ, 16) ] },
  nearer: { L: 64, tempo: 1.6, notes: () => [...seq(HYMN), ...seq(HYMN_BASS)] },
  gymno: { L: 63, meter: 3, tempo: 1.15, transpose: 2, notes: gymnopedie },
  dies: { L: 72, meter: 4, tempo: 1.5, notes: diesIrae },
  sailor: { L: 64, meter: 8, tempo: 3.1, notes: sailor },
  canon: { L: 168, meter: 8, tempo: 1.9, transpose: 2, notes: canon },
  blank: { L: 32, tempo: 2.0, notes: () => [] }
};

// ---------------------------------------------------------------- state
let L = 48, meter = 4;          // strip length in beats, beats to a bar
let transpose = 0;               // semitones the comb is tuned above C major (a song in D tunes it up 2)
const PC = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const noteLetter = r => PC[(MIDI[r] + transpose) % 12];
const noteName = r => noteLetter(r) + (Math.floor((MIDI[r] + transpose) / 12) - 1);
const noteFreq = r => FREQ[r] * Math.pow(2, transpose / 12);
let voiceOf = new Map();         // which part each preset note belongs to (bass, melody, ...)
let notes = new Set();        // key = halfBeat * 16 + row
let tapes = new Map();        // key -> {a, w}
const holeBorn = new Map();   // key -> time punched (for the pop animation)
let pT = -1.25;               // unwrapped strip position under the comb, in beats
let songId = 'twinkle';
let baseTempo = 1.9;          // beats per second when the spring is strong
let energy = 0, motorV = 0, braked = false, winding = false, keyAng = 0, fanAng = 0, windAcc = 0;
let fling = 0, movedBeats = 0, tickAcc = 0;
const tine = new Float32Array(N);
let chads = [], ripples = [];
let hover = null, drag = null;
let usedKey = false, usedCrank = false, usedFan = false, everPlayed = false;
let undoStack = [];
let now = 0;

function loadSong(id, keepPos) {
  const s = SONGS[id];
  songId = id; L = s.L; meter = s.meter || 4; transpose = s.transpose || 0; baseTempo = s.tempo; voiceOf = new Map();
  sceneRestart = true;   // loading any song, even the current one, restarts its scene and reveal
  notes = new Set(); tapes = new Map(); holeBorn.clear();
  for (const [b, r, v] of s.notes()) { const k = mod(Math.round(b * 2), 2 * L) * 16 + r; notes.add(k); if (v != null) voiceOf.set(k, v); }
  if (!keepPos) pT = Math.round(pT / L) * L - 1.25;
  refreshUi(); save();
}
function snapshot() { return { L, meter, transpose, notes: new Set(notes), tapes: new Map(tapes), songId, baseTempo }; }
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 200) undoStack.shift(); }
function undo() {
  const s = undoStack.pop(); if (!s) return;
  L = s.L; meter = s.meter || 4; transpose = s.transpose || 0; notes = s.notes; tapes = s.tapes; songId = s.songId; baseTempo = s.baseTempo;
  refreshUi(); save(); tickSound(.12);
}
function setLength(newL) {
  newL = clamp(newL, 2 * meter, 200); if (newL === L) return;
  pushUndo();
  const lim = newL * 2;
  for (const k of [...notes]) if ((k >> 4) >= lim) notes.delete(k);
  for (const k of [...tapes.keys()]) if ((k >> 4) >= lim) tapes.delete(k);
  L = newL; refreshUi(); save();
}
function refreshUi() {
  lenEl.textContent = (L / meter) + (L === meter ? ' bar' : ' bars');
  document.querySelectorAll('[data-song]').forEach(b => b.setAttribute('aria-pressed', b.dataset.song === songId ? 'true' : 'false'));
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE, JSON.stringify({ L, meter, transpose, songId, baseTempo, n: [...notes],
        tp: [...tapes].map(([k, v]) => [k, +v.a.toFixed(2), +v.w.toFixed(2)]) }));
    } catch (e) { /* storage unavailable: the strip just won't persist */ }
  }, 250);
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d || !Array.isArray(d.n) || !(d.L >= 4 && d.L <= 200)) return false;
    L = d.L; meter = d.meter || 4; transpose = d.transpose || 0; songId = d.songId || 'blank'; baseTempo = d.baseTempo || 2;
    notes = new Set(d.n.filter(k => Number.isInteger(k) && (k >> 4) < 2 * L && (k & 15) < N));
    tapes = new Map((d.tp || []).map(([k, a, w]) => [k, { a, w }]));
    refreshUi();
    return true;
  } catch (e) { return false; }
}

// ---------------------------------------------------------------- layout
let W = 0, H = 0, dpr = 1, G = {};
let deskCv = null, paperPat = null;

function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  const hb = Math.max(...[...hud.children].map(c => c.getBoundingClientRect().bottom));   // content bottom, not the fade below it
  const ir = hud.children[0].getBoundingClientRect(), tr = hud.children[1].getBoundingClientRect();
  const gapX = tr.top < ir.bottom && tr.left > ir.right ? (ir.right + tr.left) / 2 : null;   // open sky between the title and the song list, if there is any
  let rh = Math.min(26, H * 0.034, W * 0.058);
  for (; rh > 10; rh -= 0.5) {
    if (3.7 * rh + (N + 1) * rh + 5.1 * rh + 44 <= H - hb - 6) break;
  }
  const stripH = (N + 1) * rh;
  const top = hb + 6 + 3.7 * rh, bot = H - 44 - 5.1 * rh;
  const y0 = top + Math.max(0, (bot - top - stripH) * 0.45);
  const pick = Math.max(W * 0.27, rh * 6.6);
  G = {
    rh, hb, gapX, col: rh * 1.25, y0, y1: y0 + stripH, pick,
    plateL: pick - 5.7 * rh, plateR: pick + 3.0 * rh, plateT: y0 - 3.4 * rh, plateB: y0 + stripH + 1.8 * rh,
    roller: pick + 2.0 * rh,
    barrel: { x: pick - 2.65 * rh, y: y0 - 1.85 * rh, r: 1.25 * rh },
    fan: { x: pick + 1.25 * rh, y: y0 - 1.8 * rh, r: 1.0 * rh },
    hub: { x: pick - 3.3 * rh, y: y0 + stripH + 2.75 * rh }, arm: 1.75 * rh,
    mm: { x: 16, y: H - 30, w: W - 32, h: 16 }
  };
  buildDesk(); buildPaper(); buildScene(); placeMech();
}
const rowY = r => G.y0 + G.rh * (N - r);
const stripX = t => G.pick + (t / 2 - mod(pT, L)) * G.col; // t = unwrapped half-beat index relative to wrapped position

function buildDesk() {
  const c = document.createElement('canvas');
  const s = Math.min(dpr, 1.5);
  c.width = Math.ceil(W * s); c.height = Math.ceil(H * s);
  const g = c.getContext('2d'); g.scale(s, s);
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#301d12'); bg.addColorStop(1, '#1b100a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const plankH = Math.max(130, H / 4.3);
  for (let py = -rnd(0, plankH); py < H; py += plankH) {

  ctx.fillStyle = g; rr(x - w / 2, top, w, bot - top, w * .3); ctx.fill();
  ctx.restore();
  // ridges travel across the face as it turns
  const ph = pT * G.col / (w / 2);
  for (let k = 0; k < 14; k++) {
    const a = k / 14 * TAU - ph, c = Math.cos(a);

    ctx.beginPath(); ctx.moveTo(xx, top + 3); ctx.lineTo(xx, bot - 3); ctx.stroke();
  }

  ctx.fillStyle = brassGrad(x, bot, w * .7);

function drawComb() {
  const { rh, pick } = G;
  const topY = rowY(N - 1) - rh * .55, botY = rowY(0) + rh * .55, xL = pick - 5.25 * rh;
  const rootX = r => pick - rh * (1.3 + 2.4 * (1 - r / (N - 1)));

  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 7;
  const bg = ctx.createLinearGradient(xL, topY, rootX(0), botY);
  bg.addColorStop(0, '#a5abb1'); bg.addColorStop(.5, '#6c7278'); bg.addColorStop(1, '#4b5056');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(xL, topY); ctx.lineTo(rootX(N - 1) + 1, topY); ctx.lineTo(rootX(0) + 1, botY); ctx.lineTo(xL, botY); ctx.closePath(); ctx.fill();

    const j = tine[r] * rh * .07 * Math.sin(now * 95 + r * 1.7);
    const tg = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    tg.addColorStop(0, '#5b6168'); tg.addColorStop(.42, '#eef3f6'); tg.addColorStop(.6, '#b9c0c6'); tg.addColorStop(1, '#5c6268');

  }

  ctx.font = `700 ${Math.max(8, rh * .5)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let r = 0; r < N; r++) {
    const x = rootX(r) - rh * .5, y = rowY(r) + 1, ch = noteLetter(r);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillText(ch, x + .8, y + .8);
    ctx.fillStyle = r % 7 === 0 ? 'rgba(20,24,28,.85)' : 'rgba(20,24,28,.55)'; ctx.fillText(ch, x, y);

    ctx.fillStyle = gg; circle(x, y, R); ctx.fill();
  }
  for (const rp of ripples) {
    const a = 1 - rp.t / .7;
    ctx.strokeStyle = `rgba(255,214,150,${.32 * a * a})`; ctx.lineWidth = 1.2;
    circle(rp.x, rp.y, G.rh * (.35 + rp.t * 3.2)); ctx.stroke();
  }
  ctx.restore();
}

function drawBarrel() {
  const b = G.barrel, r = b.r;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 6;
  ctx.fillStyle = brassGrad(b.x, b.y, r); circle(b.x, b.y, r); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#21180e'; circle(b.x, b.y, r * .82); ctx.fill();
  // the mainspring: more turns pack toward the arbor as it winds
  const turns = 2.6 + energy * 5.5, rIn = r * .17, rOut = r * .76, steps = 220;
  ctx.strokeStyle = 'rgba(176,196,210,.9)'; ctx.lineWidth = Math.max(1, r * .045);
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const s = i / steps;
    const rad = rIn + (rOut - rIn) * Math.pow(s, 1 + energy * 1.6);
    const a = s * turns * TAU + keyAng * (1 - s);
    const x = b.x + Math.cos(a) * rad, y = b.y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);

  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 5;
  ctx.fillStyle = brassGrad(0, 0, r * .9);
  ctx.beginPath(); ctx.ellipse(-r * .45, 0, r * .36, r * .27, 0, 0, TAU); ctx.ellipse(r * .45, 0, r * .36, r * .27, 0, 0, TAU); ctx.fill();
  ctx.fillRect(-r * .45, -r * .1, r * .9, r * .2);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(60,40,12,.6)'; circle(-r * .45, 0, r * .1); ctx.fill(); circle(r * .45, 0, r * .1); ctx.fill();
  ctx.fillStyle = brassGrad(0, 0, r * .2); circle(0, 0, r * .17); ctx.fill();
  ctx.restore();
}

function drawFan() {

function drawChad(c) {
  const r = G.rh * .27, z = c.z;
  ctx.fillStyle = `rgba(0,0,0,${.28 * Math.max(.25, 1 - z / 140)})`;
  ctx.beginPath(); ctx.ellipse(c.x + 1.5 + z * .25, c.y + 2 + z * .5, r, r * .9, 0, 0, TAU); ctx.fill();
  const sc = 1 + z / 260, sy = Math.max(.15, Math.abs(Math.cos(c.flip)));

}

function hitPaper(x, y) {
  const { rh, col, y0, y1, pick } = G;
  if (y < y0 || y > y1) return null;
  if (x > G.plateL - 2 && x < G.plateR + 2) return null;
  const p = mod(pT, L);
  const t = Math.round(((x - pick) / col + p) * 2);
  const r = N - Math.round((y - y0) / rh);
  if (r < 0 || r >= N) return null;
  return { t: mod(t, 2 * L), r, x: pick + (t / 2 - p) * col, y: rowY(r) };
}

function drawHover() {
  if (!hover || drag) return;
  const { rh } = G, k = hover.t * 16 + hover.r, has = notes.has(k);

  const label = (has ? 'Tape over ' : '') + noteName(hover.r);

function hint(text, x, y, align, pulse) {
  ctx.font = `700 ${Math.max(12, G.rh * .58)}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  const a = .75 + .25 * Math.sin(now * 3 + pulse);

// While the crank is held: a faint tether from the handle to the hand, the hand's recent path in brass,
// and a wide clockwise ring around the hub, so it reads that big loose circles anywhere will turn it.
const gesture = { a: 0, trail: [] };
function drawCrankGesture() {
  const holding = drag && drag.mode === 'crank';
  gesture.a = holding ? Math.min(1, gesture.a + .07) : Math.max(0, gesture.a - .035);
  if (holding) gesture.trail = drag.trail = drag.trail.filter(p => now - p.t < .8);
  if (gesture.a <= 0) return;
  const { rh } = G, h = G.hub, k = crankPos(), A = gesture.a, ca = pT / BPR * TAU;
  ctx.save(); ctx.globalAlpha = 1;   // feedback for a hand on the crank stays visible even when the rest of the UI has stepped back
  ctx.strokeStyle = `rgba(232,196,120,${.22 * A})`; ctx.lineWidth = 1.2; ctx.setLineDash([3, 6]);
  const R = G.arm * 2.1;
  ctx.lineDashOffset = -ca * R * .5;
  ctx.beginPath(); ctx.arc(h.x, h.y, R, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = `rgba(232,196,120,${.4 * A})`;
  for (let i = 0; i < 3; i++) {
    const a = ca + i * TAU / 3, x = h.x + Math.cos(a) * R, y = h.y + Math.sin(a) * R, t = a + Math.PI / 2, z = rh * .22;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(t) * z, y + Math.sin(t) * z);
    ctx.lineTo(x + Math.cos(t + 2.5) * z, y + Math.sin(t + 2.5) * z); ctx.lineTo(x + Math.cos(t - 2.5) * z, y + Math.sin(t - 2.5) * z);
    ctx.closePath(); ctx.fill();
  }
  const tr = gesture.trail, last = tr[tr.length - 1];
  if (last) {
    ctx.strokeStyle = `rgba(239,229,207,${.18 * A})`; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(k.x, k.y); ctx.lineTo(last.x, last.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineCap = 'round';
    for (let i = 1; i < tr.length; i++) {
      const f = 1 - (now - tr[i].t) / .8;
      ctx.strokeStyle = `rgba(232,196,120,${.5 * f * A})`; ctx.lineWidth = 1 + 2.5 * f;
      ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
    }

function drawMini() {
  const m = G.mm, p = mod(pT, L), n2 = 2 * L;

  ctx.fillStyle = 'rgba(205,189,159,.8)';
  ctx.fillText('Whole strip · ' + (L / meter) + ' bars · drag here to jump', m.x, m.y - 5);
  ctx.fillStyle = 'rgba(239,229,207,.85)'; rr(m.x, m.y, m.w, m.h, 2); ctx.fill();

// ---------------------------------------------------------------- song scenes
// Each song has its own scene behind the box. It fades in as the strip gets moving and fades out as it slows,
// so a spring that is running down takes its scene with it.
let amb = 0, spd = 0, prevPT = null, playTime = 0, dawn = 0, lastScene = '';
let warm = 0, rv = 0, sf = 0;                        // seconds of steady play, reveal 0..1, eased speed 0..1
let ghost = null, sceneRestart = false;              // the previous song's scene while it dissolves
const ghostAlpha = () => ghost ? ghost.a0 * Math.sqrt(smooth(ghost.rv / Math.max(.001, ghost.rv0 || 1))) : 0;
// each scene keeps its own moving parts, so a dissolving scene and a new one can run side by side
function clearScene(sc) {
  if (SCENES4.includes(sc)) return clearScenes4(sc);
  if (sc === 'night') { noteStars = []; shooting = null; }
  else if (sc === 'fireworks') { rockets = []; sparks = []; smoke = []; launched.clear(); }
  else if (sc === 'bells') { bellRings = []; BV.swallows = []; BV.smoke = []; BV.houses.forEach(h => h.wins.forEach(w => { w.lit = false; })); }
  else if (sc === 'lanterns') { lanterns = []; waterRings = []; }
  else aur.fill(0);
}
// As the scene comes up, the interface steps back so only the box and the scene remain.
// Reaching toward the header (or tabbing into it) brings it back for a few seconds.
let uiQuiet = 0, uiWake = -10;
function quietUi(dt) {
  const target = now - uiWake < 3 ? 0 : Math.max(amb, ghostAlpha());
  uiQuiet += (target - uiQuiet) * Math.min(1, dt * (target > uiQuiet ? .8 : 4));
  hud.style.opacity = (1 - .94 * uiQuiet).toFixed(3);
}
window.addEventListener('pointermove', e => { if (G.hb && e.clientY < G.hb + 30) uiWake = now; });
hud.addEventListener('focusin', () => { uiWake = now + 1e4; });
hud.addEventListener('focusout', () => { uiWake = now; });
const REVEAL_WAIT = 5, REVEAL_BUILD = 22;
const stage = (a, b) => smooth(clamp((rv - a) / (b - a), 0, 1));   // a layer that arrives between reveal a and b
const LY = {};             // cached scene layers, rebuilt on resize
let stars = [], noteStars = [], shooting = null, moonPulse = 0;
let rockets = [], sparks = [], smoke = [], windows = [], cityPulse = 0;
const flash = { a: 0, hue: 0, x: 0, y: 0 }, launched = new Set();
const bells = [0, 1, 2].map(() => ({ a: 0, v: 0 }));
let bellRings = [], birds = [], houses = [], towers = [], hills = [];
let lanterns = [], waterRings = [];
const BV = { ridge: [], poplars: [], houses: [], swallows: [], smoke: [], bellPos: [], cloudPre: null, cloudPost: null, chapelX: 0, churchX: 0 };   // the Frère Jacques village
const aur = new Float32Array(40);

const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mixC(a, b, t, alpha) {
  const A = hexRGB(a), B = hexRGB(b), c = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  return alpha == null ? `rgb(${c})` : `rgba(${c},${alpha})`;
}

const smooth = x => x * x * (3 - 2 * x);
function horizonY() { return Math.min(H - 44, G.y1 + Math.max(28, (H - 44 - G.y1) * .45)); }
function skyBand() { return { top: 10, bot: G.y0 - 10 }; }
function sceneOf() { return { twinkle: 'night', ode: 'fireworks', frere: 'bells', nearer: 'lanterns', gymno: 'rain', dies: 'nave', sailor: 'sea', canon: 'garden' }[songId] || 'aurora'; }
const SCENES4 = ['rain', 'nave', 'sea', 'garden'];
const hillY = (i, x) => hills[i][clamp(Math.round(x / 8), 0, hills[i].length - 1)];

function buildScene() {
  const s = G.rh / 26, hz = horizonY(), sb = skyBand(), rand = seeded(7);
  LY.sd = Math.min(dpr, 1.25);
  LY.cv = document.createElement('canvas'); LY.cv.width = Math.ceil(W * LY.sd); LY.cv.height = Math.ceil(H * LY.sd);
  LY.c2 = LY.cv.getContext('2d');

  stars = [];
  const n = Math.round(W * H / 3600);
  for (let i = 0; i < n; i++) stars.push({ x: rand() * W, y: rand() * hz, r: .35 + rand() * rand() * 1.5, ph: rand() * 6, sp: .6 + rand() * 1.8 });

  // the Milky Way: a tilted band of fine stars, soft glow and a dark dust lane
  const mw = document.createElement('canvas'); mw.width = W; mw.height = H;
  const m = mw.getContext('2d');
  const ax = -W * .1, ay = H * .8, bx = W * 1.1, by = H * .02, len = Math.hypot(bx - ax, by - ay);
  const ux = (bx - ax) / len, uy = (by - ay) / len, nx = -uy, ny = ux, bw = Math.min(W, H) * .12;
  const at = (t, o) => [ax + ux * t + nx * o, ay + uy * t + ny * o];
  for (let i = 0; i < 70; i++) {

function drawLanterns() {

  ctx.globalAlpha = stage(.35, .75);
  // slow swells, closer together toward the horizon
  for (let k = 1; k <= 14; k++) {
    const f = k / 14, y = hz + f * f * (H - hz);
    ctx.strokeStyle = `rgba(170,160,230,${.04 + .05 * (1 - f)})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W + 24; x += 24) { const yy = y + Math.sin(x * .02 / (f + .25) + now * .6 + k) * 1.5 * (1 + f * 3) * s; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }

  }

    if (near <= 0) continue;

    const fl = .85 + .15 * Math.sin(now * 9 + l.fl) * Math.sin(now * 5.3 + l.fl * 2), lx = l.x + Math.sin(l.ph * .7) * 9 * l.sz, R = 30 * l.sz * fl;

  }

    const fl = .85 + .15 * Math.sin(now * 9 + l.fl) * Math.sin(now * 5.3 + l.fl * 2), lx = l.x + Math.sin(l.ph * .7) * 9 * l.sz;

}

function drawAurora() {
  const s = G.rh / 26, hz = horizonY(), sb = skyBand(), base = sb.bot + 20 * s, top = 0;
  ctx.globalAlpha = stage(0, .35); skyFill('#02060f', '#061424', '#0e2a33', hz); ctx.globalAlpha = 1;

  g.addColorStop(0, 'rgba(150,80,255,0)'); g.addColorStop(.35, 'rgba(150,90,255,.45)'); g.addColorStop(.78, 'rgba(70,255,170,.8)'); g.addColorStop(1, 'rgba(70,255,170,0)');
  ctx.fillStyle = g;

    const idx = x / W * (aur.length - 1), i0 = Math.floor(idx), note = aur[i0] + (aur[Math.min(aur.length - 1, i0 + 1)] - aur[i0]) * (idx - i0);
    const n = Math.sin(x * .012 + now * .35) * Math.sin(x * .005 - now * .2 + 1.3), inten = .1 + .45 * n * n + note * .6;

}

// render one scene at a given reveal into the offscreen layer, then lay it over the desk at the given strength
function renderScene(sc, reveal, alpha) {
  if (alpha < .004 || !LY.cv) return;
  const main = ctx, keepRv = rv, keepDawn = dawn;
  rv = reveal; dawn = reveal;
  ctx = LY.c2;
  ctx.setTransform(LY.sd, 0, 0, LY.sd, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  try {
    if (sc === 'night') drawNight(); else if (sc === 'fireworks') drawFireworks(); else if (sc === 'bells') drawBells(); else if (sc === 'lanterns') drawLanterns();
    else if (sc === 'rain') drawRain(); else if (sc === 'nave') drawNave(); else if (sc === 'sea') drawSea(); else if (sc === 'garden') drawGarden(); else drawAurora();
  } finally { ctx = main; rv = keepRv; dawn = keepDawn; }
  ctx.save(); ctx.globalAlpha = Math.min(1, alpha); ctx.drawImage(LY.cv, 0, 0, W, H); ctx.restore();
}
function drawAmb() {
  if (ghost) renderScene(ghost.scene, ghost.rv, ghostAlpha());   // the last song's scene, receding layer by layer
  renderScene(sceneOf(), rv, amb);
}

// ================================================================ four more scenes
// Gymnopédie: rain on a Paris window at night. Dies Irae: a cathedral nave by candlelight.
// Drunken Sailor: on deck at night, under a swinging lantern. Pachelbel: a baroque garden at dusk, two swans in canon.
const RN = { roofs: null, roofTop: 0, wins: [], bokeh: [], beads: [], rain: [], runs: [], pulse: 0, tower: null };
const NV = { candles: [], smoke: [], pulse: 0 };
const SEA = { clouds: null, spray: [], glints: [], swing: 0, swingV: 0, bump: 0 };

function buildScenes4(rand, s, hz) {
  // ---- Paris across the street, the cathedral, and the palace: detailed drawings made once per layout
  buildParisArt(s); buildNaveArt(s); buildPalaceArt(s);
  {

    RN.rain = []; for (let i = 0; i < 160; i++) RN.rain.push({ x: rand() * W, y: rand() * H, l: (8 + rand() * 18) * s, v: (300 + rand() * 260) * s });
    GD.flies = []; for (let i = 0; i < 40; i++) GD.flies.push({ x: rand() * W, y: G.y1 + rand() * (H - G.y1), ph: rand() * 6, sp: .3 + rand() * .6 });
  }

    const q = c.getContext('2d'); q.filter = 'blur(3px)';
    for (let i = 0; i < 26; i++) {
      const x = rand() * W, y = rand() * ch * .7, w = (60 + rand() * 140) * s;
      for (const dx of [0, -W, W]) { q.fillStyle = `rgba(${40 + rand() * 30 | 0},${52 + rand() * 30 | 0},${70 + rand() * 30 | 0},.55)`; q.beginPath(); q.ellipse(x + dx, y, w, w * .16, 0, 0, TAU); q.fill(); }
    }

  for (let tier = 0; tier < 3; tier++) for (let i = 0; i < 9 - tier; i++) NV.candles.push({ tier, i, n: 9 - tier, lit: 0, life: 0, ph: rand() * 6, h: (.7 + rand() * .5) });
}

function clearScenes4(sc) {
  if (sc === 'rain') { RN.runs = []; RN.pulse = 0; }
  else if (sc === 'nave') { NV.candles.forEach(c => { c.lit = 0; c.life = 0; }); NV.smoke = []; }
  else if (sc === 'sea') { SEA.spray = []; SEA.glints = []; }
  else if (sc === 'garden') { GD.ripples = []; GD.jets.fill(0); }
}

function updateScenes4(dt, s) {
  RN.pulse *= Math.exp(-dt * 2);
  for (const d of RN.runs) {
    // a drop on glass sticks, then slips: it moves in short runs and leaves a wet trail
    d.hold -= dt;
    if (d.hold <= 0) { d.vy = rnd(40, 140) * s; d.hold = rnd(.15, .6); } else d.vy *= Math.exp(-dt * 6);
    d.y += d.vy * dt; d.x += Math.sin(d.y * .05 + d.ph) * .15;
    d.trail.push({ x: d.x, y: d.y }); if (d.trail.length > 90) d.trail.shift();
    d.age += dt;
  }
  RN.runs = RN.runs.filter(d => d.y < H + 20 && d.age < 14);
  for (const r of RN.rain) { r.y += r.v * dt; r.x += r.v * .18 * dt; if (r.y > H) { r.y = -r.l; r.x = Math.random() * W; } }

  NV.pulse *= Math.exp(-dt * 1.2);
  for (const c of NV.candles) if (c.lit) { c.life -= dt / 45; if (c.life <= 0) { c.lit = 0; } }
  if ((sceneOf() === 'nave' || (ghost && ghost.scene === 'nave')) && Math.random() < dt * 3) NV.smoke.push({ x: W * .82 + rnd(-30, 30) * s, y: H - 10, r: 10 * s, vx: rnd(-6, 6) * s, life: 1 });
  for (const m of NV.smoke) { m.y -= 14 * s * dt; m.x += m.vx * dt + Math.sin(m.y * .02) * .3; m.r += 5 * s * dt; m.life -= dt * .08; }
  NV.smoke = NV.smoke.filter(m => m.life > 0);

  SEA.swingV += (-SEA.swing * 7 - SEA.swingV * .35) * dt + Math.sin(pT * Math.PI / 8) * .4 * dt;
  SEA.swing = clamp(SEA.swing + SEA.swingV * dt, -.6, .6);
  SEA.bump *= Math.exp(-dt * 2);
  const g = 260 * s;
  for (const p of SEA.spray) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += g * dt; p.life -= dt * .9; }
  SEA.spray = SEA.spray.filter(p => p.life > 0);
  for (const gl of SEA.glints) gl.life -= dt * 1.4;
  SEA.glints = SEA.glints.filter(gl => gl.life > 0);

  for (let i = 0; i < 8; i++) GD.jets[i] *= Math.exp(-dt * 1.3);
  for (const r of GD.ripples) r.t += dt;
  GD.ripples = GD.ripples.filter(r => r.t < 2.5);
}

function ambNote4(sc, r, v, s) {
  if (sc === 'rain') {
    if (v === 1 || (v == null && r >= 7)) {
      if (RN.runs.length < 40) RN.runs.push({ x: rnd(W * .03, W * .97), y: rnd(-10, H * .35), vy: 0, hold: 0, ph: rnd(0, 6), r: rnd(2.2, 3.6) * s, trail: [], age: 0 });
    } else { RN.pulse = Math.min(1, RN.pulse + .5); const w = RN.wins[Math.floor(Math.random() * RN.wins.length)]; if (w && Math.random() < .3) w.on = !w.on; }
  } else if (sc === 'nave') {
    if (v === 0) NV.pulse = Math.min(1, NV.pulse + .6);
    else {
      const dark = NV.candles.filter(c => !c.lit);
      const c = dark.length ? dark[Math.floor(Math.random() * dark.length)] : NV.candles.reduce((a, b) => (a.life < b.life ? a : b));
      c.lit = 1; c.life = 1;
    }
  } else if (sc === 'sea') {
    const hzS = seaHorizon();
    if (v === 2) { // the off-beat chords throw spray over the rail
      const bx = rnd(W * .35, W * .95), by = horizonY() - 4 * s;
      for (let i = 0; i < 14; i++) SEA.spray.push({ x: bx + rnd(-20, 20) * s, y: by, vx: rnd(-60, 60) * s, vy: -rnd(90, 190) * s, life: rnd(.6, 1), r: rnd(1, 2.4) * s });
    } else if (v === 0) { SEA.bump = Math.min(1, SEA.bump + .5); SEA.swingV += (Math.random() < .5 ? -1 : 1) * .6; }
    else for (let i = 0; i < 3; i++) SEA.glints.push({ x: rnd(0, W), y: hzS + rnd(4, 40) * s, life: 1, w: rnd(6, 16) * s });
  } else if (sc === 'garden') {
    if (v === 0) GD.jets[Math.floor(mod(pT + .01, 16) / 2) % 8] = 1;   // the ground bass: eight notes, eight jets
    else { const sw = swanPos(v - 1); if (sw) GD.ripples.push({ x: sw.x, y: sw.y, t: 0 }); }
  }
}

// ---- drawing ----
function drawRain() {

    ctx.fillStyle = 'rgba(30,24,20,.6)'; ctx.fillRect(w.x + w.w / 2 - .5, w.y, 1, w.h); ctx.fillRect(w.x, w.y + w.h * .45, w.w, 1);   // glazing bars

      ctx.restore();

  }

  ctx.globalAlpha = stage(.3, .7);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';

    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 60 * s);
    g.addColorStop(0, 'rgba(255,210,140,.5)'); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(l.x - 60 * s, l.y - 60 * s, 120 * s, 120 * s);
    for (let k = 0; k < 9; k++) { const y = street + 4 * s + k * k * 1.6 * s, w = (3 + k) * s * (.6 + .4 * Math.sin(now * 2 + k + l.x)); ctx.fillStyle = `rgba(255,200,130,${.25 * (1 - k / 9)})`; ctx.fillRect(l.x - w, y, w * 2, 1.5 * s); }
  }
  ctx.restore();
  ctx.fillStyle = '#121218';
  for (const l of RN.lamps || []) { ctx.fillRect(l.x - 1.2 * s, l.y, 2.4 * s, street - l.y + 2 * s); ctx.fillStyle = 'rgba(255,220,160,.95)'; ctx.beginPath(); ctx.arc(l.x, l.y, 3 * s, 0, TAU); ctx.fill(); ctx.fillStyle = '#121218'; }

function drawNave() {

    ctx.fillStyle = g; ctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
  }

// the palace, tinted by the hour: warm stone in the last sun, then blue dusk with the windows lit

// the two swans follow the same course across the pool, the second two bars behind the first, as the violins do
function swanPos(i) {
  if (i < 0 || i > 1) return null;
  const hz = horizonY(), y0 = G.y1 + (hz - G.y1) * .55, s = G.rh / 26;
  const u = mod((pT - 16 * i) / 64, 1);
  return { x: W * (.12 + .82 * u), y: y0 + Math.sin(u * TAU * 1.5) * 10 * s + (hz - y0) * .45 * Math.sin(u * Math.PI), u };
}
function drawGarden() {

  for (let i = 0; i < 8; i++) {

    const jg = ctx.createLinearGradient(0, base - jh, 0, base);

    ctx.fillStyle = jg; ctx.beginPath(); ctx.moveTo(x - 1.5 * s, base); ctx.quadraticCurveTo(x, base - jh * 1.1, x + 1.5 * s, base); ctx.fill();

  }

    ctx.fillStyle = '#e07a2a'; ctx.beginPath(); ctx.moveTo(p.x + z * .75, p.y - z * 1.95); ctx.lineTo(p.x + z * 1.15, p.y - z * 1.8); ctx.lineTo(p.x + z * .72, p.y - z * 1.75); ctx.fill();

  q.fillStyle = '#b8ab95'; q.fillRect(fx0, top, fx1 - fx0, street - top);
  q.fillStyle = '#d0c4ad'; q.fillRect(fx0, top, fx1 - fx0, 5 * s);
  q.fillStyle = '#857965'; q.fillRect(fx0, top + 5 * s, fx1 - fx0, 2 * s);
  for (let y = top + 10 * s; y < street; y += 6 * s) { q.fillStyle = 'rgba(110,98,80,.25)'; q.fillRect(fx0, y, fx1 - fx0, 1); }
  // shallow pilasters between the bays give the front its rhythm
  for (let x = fx0 + 50 * s; x < fx1; x += BAYW) { q.fillStyle = '#c4b7a0'; q.fillRect(x - 4 * s, top + 7 * s, 8 * s, street - top - 7 * s); q.fillStyle = 'rgba(90,80,64,.35)'; q.fillRect(x + 4 * s, top + 7 * s, 1.5 * s, street - top - 7 * s); }
  let fl = 0;
  for (let y = top + 12 * s; y < street - 20 * s; y += floorH, fl++) {
    const ww = BAYW * .27, wh = floorH * .6;
    for (let x = fx0 + 50 * s + (BAYW - ww) / 2; x < fx1 - 30 * s; x += BAYW) {
      q.fillStyle = '#cfc3ac'; q.fillRect(x - 3 * s, y - 3 * s, ww + 6 * s, wh + 6 * s);
      q.fillStyle = '#1e2029'; q.fillRect(x, y, ww, wh);
      q.fillStyle = '#d6cbb5'; q.beginPath(); q.moveTo(x - 4 * s, y - 3 * s); q.lineTo(x + ww / 2, y - 8 * s); q.lineTo(x + ww + 4 * s, y - 3 * s); q.closePath(); q.fill();
      RN.wins.push({ x, y, w: ww, h: wh, on: Math.random() < .45, ph: Math.random() * 6, warm: Math.random(), kind: 'win', fl });
      // balcony railing
      q.strokeStyle = '#1a1b20'; q.lineWidth = 1;
      const by = y + wh - 8 * s;
      q.beginPath(); q.moveTo(x - 4 * s, by); q.lineTo(x + ww + 4 * s, by); q.moveTo(x - 4 * s, y + wh + 1); q.lineTo(x + ww + 4 * s, y + wh + 1);
      for (let bx = x - 3 * s; bx < x + ww + 4 * s; bx += 3 * s) { q.moveTo(bx, by); q.lineTo(bx, y + wh + 1); }
      q.stroke();
      for (let bx = x; bx < x + ww; bx += 6 * s) { q.beginPath(); q.arc(bx + 3 * s, by + 4 * s, 1.6 * s, 0, TAU); q.stroke(); }
    }
    q.fillStyle = '#c7baa3'; q.fillRect(fx0, y + floorH - 10 * s, fx1 - fx0, 3 * s);
  }
  // one window has a lamp and someone who moves past the curtain now and then
  const cand = RN.wins.filter(w => w.kind === 'win' && w.y < G.y0 - 30 * s);
  RN.figure = cand.length ? cand[Math.floor(cand.length / 2)] : null;
  if (RN.figure) RN.figure.on = true;
  // the street and the café awnings at its foot
  const sg = q.createLinearGradient(0, street, 0, H);
  sg.addColorStop(0, '#1b1d26'); sg.addColorStop(1, '#0b0c12'); q.fillStyle = sg; q.fillRect(0, street, W, H - street);
  for (let x = fx0 + 30 * s; x < fx1; x += 190 * s) {
    q.fillStyle = '#5a1f22'; q.beginPath(); q.moveTo(x, street - 30 * s); q.lineTo(x + 120 * s, street - 30 * s); q.lineTo(x + 128 * s, street - 18 * s); q.lineTo(x - 8 * s, street - 18 * s); q.closePath(); q.fill();
    q.fillStyle = '#e8dcc0'; for (let sx = x; sx < x + 120 * s; sx += 16 * s) q.fillRect(sx, street - 30 * s, 8 * s, 12 * s);
    RN.wins.push({ x: x + 6 * s, y: street - 16 * s, w: 108 * s, h: 14 * s, on: true, ph: Math.random() * 6, warm: 0, kind: 'cafe' });
  }
  RN.lamps = []; for (let x = 70 * s; x < W; x += 230 * s) RN.lamps.push({ x, y: street - 46 * s });
  RN.facade = c;
}

function draw() {
  if (!W || !H || !deskCv || !deskCv.width || !deskCv.height) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(deskCv, 0, 0, W, H);
  drawAmb();
  const air = [], paperChads = [];
  const chadA = 1 - .97 * Math.max(amb, ghostAlpha());   // the punched-out bits fade away with the rest of the desk as a scene comes up
  for (const c of chads) {
    if (!c.ground) air.push(c);
    else if (onPaper(c)) paperChads.push(c);
    else if (c.x > G.plateL && c.x < G.plateR && c.y > G.plateT && c.y < G.plateB) paperChads.push(c);
    else { ctx.globalAlpha = chadA; drawChad(c); ctx.globalAlpha = 1; }
  }
  drawPlate();
  drawStrip();
  ctx.globalAlpha = chadA; for (const c of paperChads) drawChad(c); ctx.globalAlpha = 1;
  drawDrive();
  drawRoller();
  drawComb();
  drawBarrel();
  drawFan();
  drawCrank();
  drawHover();
  ctx.globalAlpha = chadA; for (const c of air) drawChad(c); ctx.globalAlpha = 1;
  // lamp falloff over everything on the desk
  const vg = ctx.createRadialGradient(W * .45, H * .42, Math.min(W, H) * .3, W * .45, H * .42, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // first-use hints and the strip map: these step back as the scene comes up
  ctx.save(); ctx.globalAlpha = 1 - .9 * uiQuiet;
  const k = crankPos();
  if (!usedCrank) { ring(k.x, k.y, G.rh * .8, 0); hint('Grab the crank, then circle', G.hub.x + G.arm + G.rh * 1.1, G.hub.y + G.rh * .2, 'left', 0); }
  drawCrankGesture();
  if (!usedKey) {
    ring(G.barrel.x, G.barrel.y, G.barrel.r * 1.12, 1.5);
    ctx.font = `700 ${Math.max(12, G.rh * .58)}px ${FONT}`;
    const hx = G.barrel.x - G.barrel.r - G.rh * .45;
    if (hx - ctx.measureText('Hold to wind').width > 6) hint('Hold to wind', hx, G.barrel.y, 'right', 1.5);
    else if (G.plateT - G.rh * 1.0 > G.hb) hint('Hold to wind', G.barrel.x, G.plateT - G.rh * .6, 'center', 1.5);
  }
  if (!usedFan && motorV > .5) hint('Touch the fan to stop', G.fan.x + G.fan.r + G.rh * .5, G.fan.y, 'left', 3);
  drawMini();
  ctx.restore();
  drawMech();
}

// ---------------------------------------------------------------- input
function inMini(x, y) { const m = G.mm; return x >= m.x - 4 && x <= m.x + m.w + 4 && y >= m.y - 8 && y <= m.y + m.h + 8; }
function miniJump(x) { const m = G.mm; const f = clamp((x - m.x) / m.w, 0, 1); pT = Math.floor(pT / L) * L + f * L; }

function zoneAt(x, y) {
  const k = crankPos();
  if (dist(x, y, k.x, k.y) < G.rh * 1.4 || dist(x, y, G.hub.x, G.hub.y) < G.rh * 1.2) return 'crank';
  if (dist(x, y, G.barrel.x, G.barrel.y) < G.barrel.r * 1.05) return 'key';
  if (dist(x, y, G.fan.x, G.fan.y) < G.fan.r * 1.15) return 'fan';
  if (inMini(x, y)) return 'mini';
  if (y > G.y0 && y < G.y1 && !(x > G.plateL && x < G.plateR)) return 'paper';
  return 'desk';
}

cvs.addEventListener('pointerdown', e => {
  ensureAudio();
  const x = e.clientX, y = e.clientY, z = zoneAt(x, y);
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  const t = performance.now();
  if (z === 'crank') { drag = { mode: 'crank', lx: x, ly: y, dir: null, trail: [{ x, y, t: now }], t0: now }; usedCrank = true; fling = 0; }
  else if (z === 'key') { drag = { mode: 'wind' }; winding = true; braked = false; usedKey = true; }
  else if (z === 'fan') { drag = { mode: 'none' }; braked = !braked; usedFan = true; tickSound(.2); }
  else if (z === 'mini') { drag = { mode: 'mini' }; miniJump(x); fling = 0; }
  else if (z === 'paper') { drag = { mode: 'paper', x0: x, y0: y, lx: x, lt: t, moved: false, vel: 0 }; fling = 0; }
  else drag = { mode: 'sweep', lx: x, ly: y, lt: t };
  hover = null;
  if (z === 'crank') cvs.style.cursor = 'grabbing';
  e.preventDefault();
});
cvs.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY, t = performance.now();
  if (!drag) {
    const z = zoneAt(x, y);
    hover = z === 'paper' ? hitPaper(x, y) : null;
    cvs.style.cursor = z === 'crank' ? 'grab' : (z === 'key' || z === 'fan' || z === 'mini') ? 'pointer' : z === 'paper' ? 'crosshair' : 'default';
    return;
  }
  if (drag.mode === 'crank') {
    // Once the crank is held, any circling motion turns it: the handle follows how much the hand's path turns,
    // so one loop of any size, anywhere on screen, is one turn of the crank. Clockwise plays forward.
    const dx = x - drag.lx, dy = y - drag.ly;
    if (Math.hypot(dx, dy) >= 4) {
      const a = Math.atan2(dy, dx);
      if (drag.dir != null) {
        const d = wrapAng(a - drag.dir);
        if (Math.abs(d) < 1.3) advance(d / TAU * BPR, 0, 'crank');
      }
      drag.dir = a; drag.lx = x; drag.ly = y;
    }
    drag.trail.push({ x, y, t: now });
    cvs.style.cursor = 'grabbing';
  } else if (drag.mode === 'paper') {
    if (!drag.moved && Math.abs(x - drag.x0) + Math.abs(y - drag.y0) > 6) { drag.moved = true; cvs.style.cursor = 'grabbing'; }
    if (drag.moved) {
      const dx = x - drag.lx, db = -dx / G.col, ds = Math.max(.001, (t - drag.lt) / 1000);
      advance(db, 0, 'paper');
      drag.vel = drag.vel * .5 + (db / ds) * .5;
      drag.lx = x; drag.lt = t;
    }
  } else if (drag.mode === 'mini') miniJump(x);
  else if (drag.mode === 'sweep') {
    const ds = Math.max(.001, (t - drag.lt) / 1000), vx = (x - drag.lx) / ds, vy = (y - drag.ly) / ds, R = G.rh * 1.5;
    for (const c of chads) {
      if (!c.ground) continue;
      if (dist(c.x, c.y, x, y) < R) { c.vx += (vx * .9 - c.vx) * .5; c.vy += (vy * .9 - c.vy) * .5; c.vr += rnd(-4, 4); }
    }
    drag.lx = x; drag.ly = y; drag.lt = t;
  }
});
function endDrag(e) {
  if (!drag) return;
  if (drag.mode === 'paper') {
    if (!drag.moved) clickPaper(drag.x0, drag.y0);
    else if (performance.now() - drag.lt < 90) fling = clamp(drag.vel, -14, 14);
  } else if (drag.mode === 'wind') winding = false;
  drag = null;
  if (e && e.type !== 'pointercancel') {
    const z = zoneAt(e.clientX, e.clientY);
    hover = z === 'paper' ? hitPaper(e.clientX, e.clientY) : null;
  }
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cvs.addEventListener('wheel', e => {
  e.preventDefault(); ensureAudio();
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / G.col * .5;
  advance(clamp(d, -4, 4), 0, 'paper');
}, { passive: false });

function clickPaper(x, y) {
  const h = hitPaper(x, y); if (!h) return;
  const k = h.t * 16 + h.r;
  pushUndo();
  if (notes.has(k)) {
    notes.delete(k);
    tapes.set(k, { a: rnd(-.3, .3), w: rnd(.95, 1.2) });
    tapeSound();
  } else {
    notes.add(k); holeBorn.set(k, now);
    punchSound(); spawnChad(h.x, h.y);

  }
  save();
}

window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (tag === 'BUTTON' || tag === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); ensureAudio(); braked = !braked; usedFan = true; }
  else if (e.key.toLowerCase() === 'w' && !e.repeat) { ensureAudio(); winding = true; braked = false; usedKey = true; }
  else if (e.key === 'ArrowRight') { ensureAudio(); advance(.5, 0, 'crank'); }
  else if (e.key === 'ArrowLeft') { advance(-.5, 0, 'crank'); }
});
window.addEventListener('keyup', e => { if (e.key.toLowerCase() === 'w') winding = false; });

document.querySelectorAll('[data-song]').forEach(b => b.addEventListener('click', () => {
  ensureAudio(); pushUndo(); loadSong(b.dataset.song); tickSound(.12);
}));
document.getElementById('len-minus').addEventListener('click', () => setLength(L - meter));
document.getElementById('len-plus').addEventListener('click', () => setLength(L + meter));
document.getElementById('undo').addEventListener('click', undo);

let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

// ---------------------------------------------------------------- boot
if (!restore()) loadSong('nearer'); else refreshUi();
layout();
let mechPref = null; try { mechPref = localStorage.getItem('paper-music-box-mech-v2'); } catch (e) {}
setMech(mechPref === '1');   // off unless the viewer has turned it on
let last = performance.now();
function frame(ms) {
  const dt = Math.min(.05, Math.max(0, (ms - last) / 1000)); last = ms; now = ms / 1000;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// test hook: step the simulation by hand when the page is not being animated
window.__pmb = {
  get state() { return { pT: +pT.toFixed(3), L, notes: notes.size, tapes: tapes.size, energy: +energy.toFixed(3), motorV: +motorV.toFixed(3), braked, chads: chads.length, lit: [...tine].filter(v => v > .05).length, amb: +amb.toFixed(2), rv: +rv.toFixed(2), warm: +warm.toFixed(1), spd: +spd.toFixed(2), sparks: sparks.length, rockets: rockets.length, scene: sceneOf(), gt: gesture.trail.length, ga: +gesture.a.toFixed(2), ui: +uiQuiet.toFixed(2), hud: hud.style.opacity, ghost: ghost ? ghost.scene + ":" + ghostAlpha().toFixed(2) : "" }; },
  wind(e) { energy = e; braked = false; },
  step(n, dt) { dt = dt || 1 / 60; for (let i = 0; i < n; i++) { now += dt; update(dt); } draw(); }
};
})();
</script>
